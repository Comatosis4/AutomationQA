version: '3.8'
services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    privileged: true
    user: root
    environment:
      - JAVA_OPTS=-Xmx3072m -Xms512m -XX:+UseG1GC
    mem_limit: 4096m
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
    - /home/${myname}/jenkins_compose/jenkins_configuration:/var/jenkins_home
    - /var/run/docker.sock:/var/run/docker.sock